# Logs standards Laravel (30 jours)
/var/log/laravel/laravel*.log {
    su root root
    daily
    rotate 30
    compress
    delaycompress
    notifempty
    missingok
    copytruncate
    dateext
    dateformat -%Y%m%d
    postrotate
        /usr/local/bin/analyze-logs.sh
    endscript
}

