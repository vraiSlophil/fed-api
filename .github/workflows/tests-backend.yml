name: 🧪 Tests Backend

on:
  workflow_call:
    inputs:
      seed:
        description: "Run database seeders (slower but closer to production data assumptions)"
        required: false
        type: boolean
        default: true
  workflow_dispatch: # Manual trigger
    inputs:
      seed:
        description: "Run database seeders (slower but closer to production data assumptions)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Laravel Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      matrix:
        php-version: ['8.3']
    
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          coverage: none

      - name: 📦 Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 🔄 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: 📥 Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: 📋 Copy .env.testing
        run: cp .env.example .env.testing

      - name: 🔧 Configure .env.testing
        run: |
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=postgres/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env.testing

      - name: 🔑 Generate application key
        run: php artisan key:generate --env=testing

      - name: 🗄️ Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan migrate --force --env=testing

      - name: 🌱 Seed database
        if: ${{ inputs.seed }}
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan db:seed --force --env=testing

      - name: 🧪 Execute tests (Unit and Feature)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: php artisan test
