name: 🚀 CI/CD Pipeline
permissions:
  contents: read

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches:
      - main
      - dev
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'docs/**'
      - 'test/**'
      - 'ci/**'
      - 'chore/**'
      - 'perf/**'
      - 'style/**'
      - 'build/**'
      - 'release/**'
      - 'revert/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🎨 Linting
    uses: ./.github/workflows/lint.yml

  test-backend:
    name: 🧪 Backend Tests
    needs: lint
    uses: ./.github/workflows/tests-backend.yml
