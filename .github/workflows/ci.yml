name: 🚀 CI/CD Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: 
      - main
      - develop
      - 'feat/**'
  workflow_dispatch:

jobs:
  lint:
    name: 🎨 Linting
    uses: ./.github/workflows/lint.yml

  test-backend:
    name: 🧪 Backend Tests
    needs: lint
    uses: ./.github/workflows/tests-backend.yml