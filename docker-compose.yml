x-laravel-common: &laravel-common
    build:
        context: .
        dockerfile: Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
        - .env
    environment:
        HOME: /tmp
        COMPOSER_HOME: /tmp/composer
        COMPOSER_CACHE_DIR: /tmp/composer/cache
    volumes:
        - ./:/app
    depends_on:
        postgres:
            condition: service_healthy
    networks:
        - app-network
    restart: unless-stopped

services:
    # Service de base de données PostgreSQL
    postgres:
        image: postgres:18.1
        environment:
            - POSTGRES_USER=${DB_USERNAME}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_DATABASE}
        networks:
            - app-network
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
            interval: 10s
            timeout: 5s
            retries: 5

    bootstrap:
        <<: *laravel-common
        command: sh -c "sh ./scripts/ensure-postgres-databases.sh && php artisan migrate --force && php artisan optimize:clear"
        restart: "no"

    # Service Laravel (application web)
    laravel:
        <<: *laravel-common
        depends_on:
            postgres:
                condition: service_healthy
            bootstrap:
                condition: service_completed_successfully
        ports:
            - "8000:8000"
        command: sh -c "php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=8000"

    queue-high:
        <<: *laravel-common
        depends_on:
            postgres:
                condition: service_healthy
            bootstrap:
                condition: service_completed_successfully
        command: sh -c "php artisan queue:work --queue=emails-verification,emails-password-reset --tries=3 --sleep=1 --timeout=120"

    queue-low:
        <<: *laravel-common
        depends_on:
            postgres:
                condition: service_healthy
            bootstrap:
                condition: service_completed_successfully
        command: sh -c "php artisan queue:work --queue=emails-invitation,default --tries=3 --sleep=3 --timeout=120"

    scheduler:
        <<: *laravel-common
        depends_on:
            postgres:
                condition: service_healthy
            bootstrap:
                condition: service_completed_successfully
        command: sh -c "php artisan schedule:work"

    # Service de rotation et analyse des logs
    # logrotate:
    #     build:
    #         context: .
    #         dockerfile: Dockerfile.logrotate
    #     volumes:
    #         - laravel_logs:/var/log/laravel
    #     networks:
    #         - app-network
        # restart: unless-stopped

    pgadmin:
        image: dpage/pgadmin4:9
        depends_on:
            - postgres
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
        ports:
            - "8080:80"
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    laravel_logs:
        driver: local
