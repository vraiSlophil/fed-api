services:
    # Service de base de données MariaDB
    mariadb:
        image: bitnami/mariadb:11.4.6-debian-12-r0
        environment:
            - ALLOW_EMPTY_PASSWORD=no
            - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
            - MARIADB_USER=${DB_USERNAME}
            - MARIADB_PASSWORD=${DB_PASSWORD}
            - MARIADB_DATABASE=${DB_DATABASE}
        volumes:
            - mariadb_data:/bitnami/mariadb
        networks:
            - app-network

    # Service Laravel (application web)
    laravel:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        environment:
            - DB_HOST=mariadb
            - DB_PORT=${DB_PORT}
            - DB_USERNAME=${DB_USERNAME}
            - DB_DATABASE=${DB_DATABASE}
            - DB_PASSWORD=${DB_PASSWORD}
            - ENV LARAVEL_SKIP_CHOWN=yes
        volumes:
            - ./:/app
        depends_on:
            - mariadb
        networks:
            - app-network

    phpmyadmin:
        image: phpmyadmin:5.2.2
        depends_on:
            - mariadb
        environment:
            PMA_HOST: mariadb           # Se connecte au service MariaDB
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
            # Optionnel : PMA_ABSOLUTE_URI, UPLOAD_LIMIT, etc.
        ports:
            - "8080:80"                # http://localhost:8080
        networks:
            - app-network


networks:
    app-network:
        driver: bridge

volumes:
    mariadb_data:
        driver: local
